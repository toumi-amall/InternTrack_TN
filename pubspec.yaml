name: interntrack_tn
description: "InternTrack TN - Your internship journey, organized."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & Navigation
  get: ^4.6.5
  provider: ^6.0.0

  # UI & Design
  flutter_svg: ^2.0.0
  google_fonts: ^6.0.0
  cached_network_image: ^3.3.0

  # Charts & Graphs
  fl_chart: ^0.65.0
  charts_flutter: ^0.12.0

  # Date & Time
  intl: ^0.17.0
  table_calendar: ^3.0.0

  # Local Storage
  hive: ^2.2.0
  hive_flutter: ^1.1.0

  # Networking (for future API calls)
  http: ^1.1.0
  dio: ^5.3.0

  # Notifications
  flutter_local_notifications: ^19.4.0

  # State Persistence
  shared_preferences: ^2.2.0

  # Utils
  uuid: ^4.0.0
  logger: ^2.0.0

  # Animations
  lottie: ^2.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Build & Code Generation
  build_runner: ^2.4.0
  hive_generator: ^2.0.0

  # Linting & Code Quality
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Assets (uncomment and add your assets)
  # assets:
  #   - assets/images/
  #   - assets/icons/
  #   - assets/animations/

  # Fonts (uncomment if needed)
  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf
  #       - asset: assets/fonts/Poppins-Bold.ttf
  #         weight: 700